[project]
name = "ai801"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "pygame>=2.6.1",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blackjack_rl"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
