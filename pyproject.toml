[project]
name = "ai801"
version = "0.1.0"
description = "Blackjack reinforcement learning: a Gymnasium environment with split, double and a finite shoe, plus Q-learning and DQN agents with Hi-Lo card counting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pygame>=2.6.1",
    "torch>=2.15.0",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blackjack_rl"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# CPU-only torch on Linux (Docker, Colab's uv sync): the default wheel pulls in several GB of CUDA
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
